<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mistral Vibe - Remote Harness</title>
    <style>
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #1a1a1a;
            --bg-tertiary: #2a2a2a;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0a0;
            --text-muted: #606060;
            --accent: #7b68ee;
            --accent-hover: #9d4edd;
            --success: #4caf50;
            --error: #f44336;
            --warning: #ff9800;
            --border: #3a3a3a;
            --shadow: rgba(0, 0, 0, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 1600px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            background: var(--bg-secondary);
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .header .logo {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.25rem;
        }

        .header .status {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse 2s infinite;
        }

        .status-indicator.disconnected {
            background: var(--error);
            animation: none;
        }

        .status-text {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Main Layout */
        .main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 300px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .sidebar h2 {
            font-size: 1rem;
            font-weight: 500;
            margin-bottom: 1rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .conversation-list {
            flex: 1;
            overflow-y: auto;
        }

        .conversation-item {
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 0.25rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .conversation-item:hover {
            background: var(--bg-tertiary);
        }

        .conversation-item.active {
            background: var(--accent);
            color: white;
        }

        .conversation-item .icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-tertiary);
            border-radius: 0.375rem;
        }

        .conversation-item.active .icon {
            background: rgba(255, 255, 255, 0.2);
        }

        .conversation-item .content {
            flex: 1;
            min-width: 0;
        }

        .conversation-item .title {
            font-size: 0.875rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .conversation-item .timestamp {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .new-conversation-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            transition: background 0.2s;
            margin-top: auto;
        }

        .new-conversation-btn:hover {
            background: var(--accent-hover);
        }

        /* Content Area */
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Chat Area */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .chat-area.empty {
            align-items: center;
            justify-content: center;
            text-align: center;
            color: var(--text-muted);
        }

        .message {
            display: flex;
            gap: 1rem;
            max-width: 80%;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message.assistant {
            align-self: flex-start;
        }

        .message .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--bg-tertiary);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-weight: bold;
        }

        .message.user .avatar {
            background: var(--accent);
        }

        .message .content {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .message .bubble {
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            max-width: 100%;
            word-wrap: break-word;
        }

        .message.user .bubble {
            background: var(--accent);
            color: white;
            border-bottom-right-radius: 0.125rem;
        }

        .message.assistant .bubble {
            background: var(--bg-tertiary);
            border-bottom-left-radius: 0.125rem;
        }

        .message .timestamp {
            font-size: 0.75rem;
            color: var(--text-muted);
            padding: 0 0.5rem;
        }

        .message .status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0 0.5rem;
        }

        .message .status-dots {
            display: flex;
            gap: 0.25rem;
        }

        .message .status-dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--text-muted);
            animation: typing 1.4s infinite ease-in-out;
        }

        .message .status-dots span:nth-child(1) { animation-delay: 0s; }
        .message .status-dots span:nth-child(2) { animation-delay: 0.2s; }
        .message .status-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.4;
            }
            30% {
                transform: translateY(-4px);
                opacity: 1;
            }
        }

        /* Input Area */
        .input-area {
            padding: 1.5rem;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            flex-shrink: 0;
        }

        .input-container {
            display: flex;
            gap: 1rem;
            align-items: flex-end;
        }

        .prompt-input {
            flex: 1;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            font-size: 1rem;
            resize: none;
            font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .prompt-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(123, 104, 238, 0.2);
        }

        .prompt-input::placeholder {
            color: var(--text-muted);
        }

        .send-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            transition: background 0.2s, transform 0.1s;
            white-space: nowrap;
        }

        .send-btn:hover {
            background: var(--accent-hover);
        }

        .send-btn:active {
            transform: scale(0.98);
        }

        .send-btn:disabled {
            background: var(--bg-tertiary);
            color: var(--text-muted);
            cursor: not-allowed;
            transform: none;
        }

        .input-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.5rem;
            justify-content: flex-end;
        }

        .action-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 0.375rem 0.75rem;
            border-radius: 0.375rem;
            cursor: pointer;
            font-size: 0.75rem;
            transition: all 0.2s;
        }

        .action-btn:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        /* Command Palette */
        .command-palette {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(4px);
            display: none;
            z-index: 1000;
        }

        .command-palette.active {
            display: flex;
            flex-direction: column;
        }

        .command-palette .search {
            padding: 1rem 2rem;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
        }

        .command-palette input {
            width: 100%;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            font-size: 1rem;
        }

        .command-palette .results {
            flex: 1;
            overflow-y: auto;
            padding: 1rem 2rem;
        }

        /* Settings Panel */
        .settings-panel {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            width: 350px;
            background: var(--bg-secondary);
            border-left: 1px solid var(--border);
            transform: translateX(100%);
            transition: transform 0.3s ease;
            z-index: 1000;
            display: flex;
            flex-direction: column;
        }

        .settings-panel.active {
            transform: translateX(0);
        }

        .settings-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .settings-header h2 {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .settings-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 1.5rem;
            padding: 0.25rem;
        }

        .settings-content {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
        }

        .settings-section {
            margin-bottom: 2rem;
        }

        .settings-section h3 {
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 1rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .settings-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--border);
        }

        .settings-row:last-child {
            border-bottom: none;
        }

        .settings-label {
            font-size: 0.875rem;
        }

        .settings-value {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        /* Terminal Output */
        .terminal-output {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            padding: 1rem;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.875rem;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .terminal-output .line {
            display: block;
        }

        .terminal-output .prompt {
            color: var(--accent);
        }

        .terminal-output .stdout {
            color: var(--text-primary);
        }

        .terminal-output .stderr {
            color: var(--error);
        }

        /* Loading State */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid var(--text-muted);
            border-radius: 50%;
            border-top-color: var(--accent);
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Connection Status Bar */
        .connection-bar {
            background: var(--bg-secondary);
            padding: 0.5rem 1rem;
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .connection-status .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--success);
        }

        .connection-status.disconnected .dot {
            background: var(--error);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .main {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                height: 200px;
                border-right: none;
                border-bottom: 1px solid var(--border);
            }

            .message {
                max-width: 90%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>
                <span class="logo">V</span>
                <span>Mistral Vibe Remote</span>
            </h1>
            <div class="status">
                <span class="status-indicator" id="serverStatus"></span>
                <span class="status-text" id="statusText">Connecting...</span>
            </div>
        </header>

        <div class="main">
            <aside class="sidebar">
                <h2>Conversations</h2>
                <div class="conversation-list" id="conversationList">
                    <!-- Conversations will be added here -->
                </div>
                <button class="new-conversation-btn" id="newConversationBtn">
                    + New Conversation
                </button>
            </aside>

            <main class="content">
                <div class="chat-area" id="chatArea">
                    <div class="empty">
                        <h2>Welcome to Mistral Vibe Remote Harness</h2>
                        <p>Start a new conversation to begin</p>
                    </div>
                </div>

                <div class="connection-bar">
                    <div class="connection-status" id="connectionStatus">
                        <span class="dot"></span>
                        <span>Connected to server</span>
                    </div>
                    <div id="currentAction">Idle</div>
                </div>

                <div class="input-area">
                    <div class="input-container">
                        <textarea 
                            class="prompt-input" 
                            id="promptInput" 
                            placeholder="Type your message or command... (e.g., 'ls', 'read_file path/to/file')"
                            rows="1"
                        ></textarea>
                        <button class="send-btn" id="sendBtn">Send</button>
                    </div>
                    <div class="input-actions">
                        <button class="action-btn" id="interruptBtn" disabled>Interrupt (Ctrl+C)</button>
                        <button class="action-btn" id="clearBtn">Clear Chat</button>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Settings Panel -->
    <div class="settings-panel" id="settingsPanel">
        <div class="settings-header">
            <h2>Settings</h2>
            <button class="settings-close" id="settingsClose">&times;</button>
        </div>
        <div class="settings-content">
            <div class="settings-section">
                <h3>Server</h3>
                <div class="settings-row">
                    <span class="settings-label">WebSocket URL</span>
                    <span class="settings-value" id="wsUrl">ws://localhost:3000/ws</span>
                </div>
                <div class="settings-row">
                    <span class="settings-label">HTTP URL</span>
                    <span class="settings-value">http://localhost:3000</span>
                </div>
            </div>
            <div class="settings-section">
                <h3>Session</h3>
                <div class="settings-row">
                    <span class="settings-label">Current Directory</span>
                    <span class="settings-value" id="currentDir">Loading...</span>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
